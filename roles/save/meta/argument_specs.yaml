---
argument_specs:
  main:
    short_description: Save the running configuration to the startup configuration
    description:
      - Supports Dell OS9 (C(ansible_network_os=dellemc.os9.os9)), Cisco NXOS
        (C(ansible_network_os=cisco.nxos.nxos)) and NVIDIA Cumulus Linux 5 through NVUE
        (C(ansible_network_os=nvidia.nvue)). Hosts with any other
        C(ansible_network_os) are skipped.
      - On NVUE switches this saves the applied configuration. Pending changes that were
        never applied are not saved.
    options: {}
