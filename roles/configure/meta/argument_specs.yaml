---
argument_specs:
  main:
    short_description: Make a switch match its interface and VLAN manifests
    description:
      - Reads the switch configuration, generates the commands that make it match the
        O(interfaces) and O(vlans) manifests, and applies and saves them.
      - Supports Dell OS9 (C(ansible_network_os=dellemc.os9.os9)), Cisco NXOS
        (C(ansible_network_os=cisco.nxos.nxos)) and NVIDIA Cumulus Linux 5 through NVUE
        (C(ansible_network_os=nvidia.nvue)). Hosts with any other C(ansible_network_os)
        are skipped.
      - Dell OS9 needs the C(dellemc.os9) collection and Cisco NXOS needs the
        C(cisco.nxos) collection. NVUE switches are configured with C(ansible.builtin.raw),
        so any SSH connection works, for example C(ansible.netcommon.libssh).
    options:
      interfaces:
        description:
          - The interface manifest, keyed by interface name.
          - See the collection README for the fields each switch OS supports.
        type: dict
        required: true
      vlans:
        description:
          - The VLAN manifest. Each VLAN has an C(id), C(name), C(description) and
            C(fabrics), and optionally C(managed).
          - A VLAN is configured only on hosts that are in at least one of the
            inventory groups listed in its C(fabrics).
        type: list
        elements: dict
        required: true
      diff_only:
        description:
          - Stage the changes and show the diff without applying them.
          - Only NVUE switches honor this.
        type: bool
        default: false
