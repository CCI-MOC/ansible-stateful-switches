name: CI

on:
  push:
  pull_request:
  # The Release workflow runs the tests before it publishes
  workflow_call:

jobs:
  ansible-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test: [units, sanity]
    env:
      PYTHON_VERSION: "3.14"
      COLLECTION: cci_moc/stateful_switches
    steps:
      - uses: actions/checkout@v7
        with:
          # ansible-test only runs from inside an ansible_collections/<namespace>/<name> path
          path: ansible_collections/${{ env.COLLECTION }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ansible-core
        run: pip install ansible-core

      - name: Unit Tests
        if: matrix.test == 'units'
        working-directory: ansible_collections/${{ env.COLLECTION }}
        run: ansible-test units --venv --requirements --python "$PYTHON_VERSION"

      # pep8 is skipped because ruff checks style in pre-commit, and pep8 rejects the
      # column-aligned test tables
      - name: Sanity Tests
        if: matrix.test == 'sanity'
        working-directory: ansible_collections/${{ env.COLLECTION }}
        run: ansible-test sanity --venv --requirements --python "$PYTHON_VERSION" --skip-test pep8

  # ansible-test does not check what Galaxy requires of a collection, for example a
  # README.md in every role, so run Galaxy's importer on the built collection
  galaxy-import:
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install galaxy-importer
        run: pip install galaxy-importer

      - name: Build Collection
        run: ansible-galaxy collection build --output-path build

      - name: Import Collection
        working-directory: build
        run: python -m galaxy_importer.main ./*.tar.gz
